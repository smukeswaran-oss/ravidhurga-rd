<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ravi Kannan &amp; Dhurga Priya — Wedding Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Catamaran:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-deep:#280509;
    --maroon:#4A0E17;
    --maroon-soft:#6B1524;
    --wine:#8C1F30;
    --gold:#C9A227;
    --gold-bright:#F0D488;
    --gold-pale:#F7E7B8;
    --cream:#FBF1DD;
    --rose:#D88E9A;
    --ink:#1A0304;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    overflow-x:hidden;
  }

  body{
    font-family:'Cormorant Garamond', serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
  }

  /* Desktop / tablet backdrop so the card doesn't float in a flat void */
  @media (min-width:481px){
    body{
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(140,31,48,0.35), transparent 55%),
        radial-gradient(100% 80% at 50% 100%, rgba(201,162,39,0.08), transparent 60%),
        var(--ink);
    }
  }

  button, [role="button"]{ cursor:pointer; }
  button:focus-visible, [role="button"]:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:4px;
  }

  /* ================= OUTER PHONE-STYLE CANVAS ================= */
  .device{
    position:relative;
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    max-height:960px;
    overflow:hidden;
    background:var(--maroon-deep);
    box-shadow:0 0 0 1px rgba(201,162,39,0.15);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  @media (min-width:481px){
    body{ padding:28px 16px; }
    .device{
      max-height:860px;
      border-radius:28px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.65),
        0 0 0 8px var(--ink),
        0 0 0 9px rgba(201,162,39,0.35);
    }
  }

  /* Larger desktop / tablet screens: give the invitation a touch more room to breathe */
  @media (min-width:900px){
    .device{
      max-width:520px;
      max-height:900px;
    }
  }

  /* ================= INVITATION FRAME / BACKDROP ================= */
  .invitation-frame{
    position:absolute; inset:0;
    padding:clamp(10px,3.4vw,20px);
    background:
      radial-gradient(140% 70% at 50% 0%, rgba(201,162,39,0.14), transparent 58%),
      radial-gradient(120% 80% at 50% 100%, rgba(140,31,48,0.35), transparent 55%),
      repeating-conic-gradient(from 0deg at 50% 50%, rgba(201,162,39,0.03) 0deg 6deg, transparent 6deg 12deg),
      linear-gradient(180deg, var(--maroon-deep), var(--maroon) 55%, var(--maroon-deep));
    overflow:hidden;
  }

  .invitation-frame::before{
    content:"";
    position:absolute; inset:9px;
    border:1.5px solid rgba(201,162,39,0.5);
    border-radius:16px;
    pointer-events:none;
  }
  .invitation-frame::after{
    content:"";
    position:absolute; inset:15px;
    border:1px solid rgba(201,162,39,0.24);
    border-radius:12px;
    pointer-events:none;
  }

  /* slow rotating mandala watermark for a traditional feel */
  .mandala{
    position:absolute; left:50%; top:50%;
    width:130vmin; height:130vmin;
    max-width:820px; max-height:820px;
    transform:translate(-50%,-50%);
    opacity:0.06;
    animation:mandalaSpin 140s linear infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes mandalaSpin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }

  .corner{
    position:absolute; width:clamp(48px,10vw,78px); height:clamp(48px,10vw,78px);
    opacity:0.85; pointer-events:none; z-index:2;
  }
  .corner svg{ width:100%; height:100%; display:block; }
  .corner.tl{ top:15px; left:15px; }
  .corner.tr{ top:15px; right:15px; transform:scaleX(-1); }
  .corner.bl{ bottom:15px; left:15px; transform:scaleY(-1); }
  .corner.br{ bottom:15px; right:15px; transform:scale(-1,-1); }

  /* ================= AMBIENT PETALS + KOLAM DOTS ================= */
  .ambient-petals{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
  .ambient-petals span{
    position:absolute; top:-8%;
    font-size:15px; opacity:0.32;
    animation:driftDown linear infinite;
    filter:drop-shadow(0 0 3px rgba(201,162,39,0.3));
  }
  .ambient-petals span:nth-child(1){ left:8%;  animation-duration:17s; animation-delay:0s;  font-size:14px;}
  .ambient-petals span:nth-child(2){ left:22%; animation-duration:22s; animation-delay:3s;  font-size:11px;}
  .ambient-petals span:nth-child(3){ left:41%; animation-duration:19s; animation-delay:6s;  font-size:16px;}
  .ambient-petals span:nth-child(4){ left:63%; animation-duration:24s; animation-delay:1s;  font-size:12px;}
  .ambient-petals span:nth-child(5){ left:80%; animation-duration:20s; animation-delay:5s;  font-size:15px;}
  .ambient-petals span:nth-child(6){ left:92%; animation-duration:26s; animation-delay:8s;  font-size:11px;}

  @keyframes driftDown{
    0%{ transform:translateY(-10%) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.32; }
    90%{ opacity:0.2; }
    100%{ transform:translateY(115vh) translateX(22px) rotate(190deg); opacity:0; }
  }

  .sparks{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
  .sparks span{
    position:absolute;
    width:3px; height:3px; border-radius:50%;
    background:var(--gold-bright);
    opacity:0;
    animation:twinkle ease-in-out infinite;
    box-shadow:0 0 6px 1px rgba(240,212,136,0.8);
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(0.6); }
    50%{ opacity:0.85; transform:scale(1.3); }
  }

  /* ================= MUSIC BUTTON ================= */
  .music-btn{
    position:absolute; top:clamp(16px,3.6vw,24px); right:clamp(16px,4.4vw,30px);
    z-index:20;
    background:rgba(40,5,9,0.55);
    border:1px solid rgba(201,162,39,0.55);
    color:var(--gold-bright);
    font-family:'Catamaran', sans-serif;
    font-weight:400;
    font-size:clamp(11px,1.6vw,13px);
    letter-spacing:0.03em;
    padding:7px 13px;
    border-radius:999px;
    backdrop-filter:blur(2px);
    transition:background .3s ease, transform .2s ease, box-shadow .3s ease;
  }
  .music-btn:hover{ transform:translateY(-1px); box-shadow:0 0 14px rgba(201,162,39,0.35); }
  .music-btn.active{ background:rgba(201,162,39,0.18); box-shadow:0 0 16px rgba(201,162,39,0.45); }

  /* ================= STAGE ================= */
  .stage{ position:relative; z-index:3; height:100%; display:flex; align-items:center; justify-content:center; }

  .pre-open, .reveal{
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:0 7vw;
  }
  .pre-open{ transition:opacity .5s ease; }
  .pre-open.fade-out{ opacity:0; pointer-events:none; }
  .reveal.hidden-state{ display:none; }

  .blessing{
    font-family:'Catamaran', sans-serif;
    font-weight:300;
    font-size:clamp(12px,2.3vw,16px);
    letter-spacing:0.05em;
    color:var(--gold-bright);
    opacity:0.88;
    margin:0 0 clamp(14px,4vh,30px) 0;
    transition:opacity .45s ease;
  }
  #preOpen.opening .blessing,
  #preOpen.opening .hint{ opacity:0; }

  /* ================= HEART (idle / click / split) ================= */
  .heart-stage{
    position:relative;
    width:clamp(180px,42vw,260px);
    height:clamp(166px,39vw,240px);
    animation:idlePulse 3.6s ease-in-out infinite;
    transition:transform 1s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  @keyframes idlePulse{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 26px rgba(201,162,39,0.35)); }
    50%{ transform:scale(1.035); filter:drop-shadow(0 0 40px rgba(201,162,39,0.55)); }
  }

  .heart-stage.zooming{
    animation:none;
    transform:scale(2.05);
    filter:drop-shadow(0 0 70px rgba(240,212,136,0.9));
  }

  .heart-svg{ position:absolute; inset:0; width:100%; height:100%; }
  .heart-svg path{ filter:drop-shadow(0 0 20px rgba(201,162,39,0.4)); }

  .heart-svg.half.left{ clip-path:inset(0 50% 0 0); transform-origin:78% 50%; }
  .heart-svg.half.right{ clip-path:inset(0 0 0 50%); transform-origin:22% 50%; }

  .heart-stage.split .heart-svg.half.left{ animation:splitLeft 1.1s cubic-bezier(.65,0,.35,1) forwards; }
  .heart-stage.split .heart-svg.half.right{ animation:splitRight 1.1s cubic-bezier(.65,0,.35,1) forwards; }

  @keyframes splitLeft{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    50%{ transform:translate(-10%,3%) rotate(-10deg); opacity:1; }
    100%{ transform:translate(-150%,14%) rotate(-30deg); opacity:0; }
  }
  @keyframes splitRight{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    50%{ transform:translate(10%,3%) rotate(10deg); opacity:1; }
    100%{ transform:translate(150%,14%) rotate(30deg); opacity:0; }
  }

  .heart-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:0 24%;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:clamp(10px,2vw,13px);
    letter-spacing:0.02em;
    line-height:1.5;
    color:var(--cream);
    text-shadow:0 1px 8px rgba(0,0,0,0.5);
    z-index:5;
    opacity:0;
    transition:opacity .5s ease;
  }
  .heart-stage.idle-label .heart-label{ opacity:0.85; }
  .heart-stage.zooming .heart-label,
  .heart-stage.split .heart-label{ opacity:0; }

  .small-heart{
    position:absolute; left:50%; top:50%;
    width:15%; height:15%;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    z-index:6;
    filter:drop-shadow(0 0 18px rgba(240,212,136,0.9));
  }
  .heart-stage.split .small-heart{
    animation:smallHeartRise 1.4s ease .25s forwards;
  }
  @keyframes smallHeartRise{
    0%{  transform:translate(-50%,-50%) scale(0);    opacity:0; }
    35%{ transform:translate(-50%,-50%) scale(1.25); opacity:1; }
    60%{ transform:translate(-50%,-50%) scale(1);    opacity:1; }
    100%{transform:translate(-50%,-50%) scale(1.06); opacity:1; }
  }

  .hint{
    margin-top:clamp(18px,4vh,30px);
    font-family:'Catamaran', sans-serif;
    font-weight:300;
    font-size:clamp(11px,1.9vw,13px);
    letter-spacing:0.09em;
    color:rgba(251,241,221,0.7);
    animation:pulseHint 2.4s ease-in-out infinite;
    transition:opacity .5s ease;
  }
  @keyframes pulseHint{ 0%,100%{ opacity:0.55; } 50%{ opacity:1; } }

  /* ================= FULLSCREEN HEART TAKEOVER ================= */
  .fullscreen-heart{
    position:absolute; inset:0;
    z-index:40;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    pointer-events:none;
    overflow:hidden;
    background:transparent;
  }
  .fullscreen-heart.showing{ opacity:1; }
  .fullscreen-heart.fading{ transition:opacity .85s ease; opacity:0; }

  .fs-glow{
    position:absolute; inset:-20%;
    background:radial-gradient(circle at 50% 50%, rgba(201,162,39,0.95) 0%, rgba(140,31,48,0.85) 38%, var(--maroon-deep) 72%);
    opacity:0;
    transform:scale(0.2);
    transition:opacity .9s ease, transform 1s cubic-bezier(.3,0,.2,1);
  }
  .fullscreen-heart.grow .fs-glow{ opacity:1; transform:scale(1); }

  .fs-heart{
    position:relative;
    width:60px; height:56px;
    transform:scale(1);
    transition:transform 1s cubic-bezier(.3,0,.15,1);
    filter:drop-shadow(0 0 40px rgba(240,212,136,1));
  }
  .fullscreen-heart.grow .fs-heart{ transform:scale(34); }
  .fs-heart svg{ width:100%; height:100%; display:block; }

  .fs-particles{ position:absolute; inset:0; pointer-events:none; z-index:2; }
  .fs-particles span{
    position:absolute;
    opacity:0;
    animation:fsFloat ease-out forwards;
  }
  @keyframes fsFloat{
    0%{ opacity:0; transform:translateY(0) scale(0.4) rotate(0deg); }
    15%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-70vh) scale(1) rotate(60deg); }
  }

  /* ================= NAME + DETAILS REVEAL ================= */
  .mini-heart{
    width:34px; height:32px;
    margin-bottom:clamp(10px,2.6vh,18px);
    filter:drop-shadow(0 0 12px rgba(240,212,136,0.85));
    opacity:0;
    animation:fadeUp .9s ease forwards;
    animation-delay:.05s;
  }

  .name{
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:clamp(27px,7.4vw,42px);
    letter-spacing:0.05em;
    margin:0;
    line-height:1.28;
    background:linear-gradient(180deg, var(--gold-pale) 0%, var(--gold) 55%, var(--gold-bright) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(201,162,39,0.35);
  }
  .name .letter{
    display:inline-block;
    opacity:0;
    transform:translateY(16px);
    animation:letterIn .7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes letterIn{ to{ opacity:1; transform:translateY(0); } }

  #nameTop{ margin-top:0; }
  #nameBottom{ margin-top:clamp(2px,0.6vh,6px); }

  .name-divider{
    width:64px; height:1px;
    margin:clamp(10px,2.6vh,18px) 0;
    background:linear-gradient(90deg, transparent, rgba(201,162,39,0.9), transparent);
    opacity:0;
    animation:fadeUp .9s ease forwards;
    animation-delay:.7s;
  }

  .msg-block{
    margin:clamp(14px,3.4vh,26px) 0 clamp(6px,1.6vh,12px) 0;
  }
  .msg-block p{ margin:0 0 clamp(6px,1.6vh,11px) 0; opacity:0; animation:fadeUp .9s ease forwards; }

  .anniversary-msg{
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:clamp(15px,3.6vw,19px);
    letter-spacing:0.03em;
    color:var(--gold-bright);
    animation-delay:.95s !important;
  }
  .together-since{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(16px,4vw,21px);
    color:var(--cream);
    animation-delay:1.2s !important;
  }
  .forever{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(15px,3.6vw,19px);
    color:var(--rose);
    animation-delay:1.42s !important;
  }
  .wish{
    font-family:'Catamaran', sans-serif;
    font-weight:300;
    font-size:clamp(12.5px,2.8vw,14.5px);
    line-height:1.55;
    color:rgba(251,241,221,0.82);
    max-width:34ch;
    margin-left:auto !important; margin-right:auto !important;
    animation-delay:1.68s !important;
  }

  @keyframes fadeUp{
    0%{ opacity:0; transform:translateY(12px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  .reveal .mini-heart-bottom{ display:none; }

  @media (max-height:640px){
    .msg-block p{ margin-bottom:6px; }
  }

  @media (prefers-reduced-motion: reduce){
    .heart-stage{ animation:none; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="invitation-frame" id="app">

    <svg class="mandala" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="#C9A227" stroke-width="0.4">
        <circle cx="100" cy="100" r="90"/>
        <circle cx="100" cy="100" r="76"/>
        <circle cx="100" cy="100" r="60"/>
        <g id="petalRing"></g>
      </g>
    </svg>

    <div class="corner tl"><svg viewBox="0 0 80 80"><path d="M4 4 C 30 4, 40 14, 40 40 M4 4 C 4 30, 14 40, 40 40 M4 4 C 18 4, 24 10, 24 24 M4 4 C 4 18, 10 24, 24 24" stroke="#C9A227" stroke-width="1.4" fill="none" opacity="0.75"/><circle cx="4" cy="4" r="2.6" fill="#C9A227" opacity="0.8"/></svg></div>
    <div class="corner tr"><svg viewBox="0 0 80 80"><path d="M4 4 C 30 4, 40 14, 40 40 M4 4 C 4 30, 14 40, 40 40 M4 4 C 18 4, 24 10, 24 24 M4 4 C 4 18, 10 24, 24 24" stroke="#C9A227" stroke-width="1.4" fill="none" opacity="0.75"/><circle cx="4" cy="4" r="2.6" fill="#C9A227" opacity="0.8"/></svg></div>
    <div class="corner bl"><svg viewBox="0 0 80 80"><path d="M4 4 C 30 4, 40 14, 40 40 M4 4 C 4 30, 14 40, 40 40 M4 4 C 18 4, 24 10, 24 24 M4 4 C 4 18, 10 24, 24 24" stroke="#C9A227" stroke-width="1.4" fill="none" opacity="0.75"/><circle cx="4" cy="4" r="2.6" fill="#C9A227" opacity="0.8"/></svg></div>
    <div class="corner br"><svg viewBox="0 0 80 80"><path d="M4 4 C 30 4, 40 14, 40 40 M4 4 C 4 30, 14 40, 40 40 M4 4 C 18 4, 24 10, 24 24 M4 4 C 4 18, 10 24, 24 24" stroke="#C9A227" stroke-width="1.4" fill="none" opacity="0.75"/><circle cx="4" cy="4" r="2.6" fill="#C9A227" opacity="0.8"/></svg></div>

    <button id="musicToggle" class="music-btn" aria-pressed="false">🎵 Music</button>

    <div class="ambient-petals" aria-hidden="true">
      <span>🌸</span><span>🌼</span><span>🌸</span><span>🌺</span><span>🌸</span><span>🌼</span>
    </div>
    <div class="sparks" id="sparks" aria-hidden="true"></div>

    <main class="stage">

      <section id="preOpen" class="pre-open">
        <p class="blessing">இனிய திருமண நாள் வாழ்த்துக்கள்</p>

        <div class="heart-stage idle-label" id="heartStage" tabindex="0" role="button"
             aria-label="Tap to open the anniversary heart">
          <svg class="heart-svg half left" viewBox="0 0 32 29.6" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#F0D488"/>
                <stop offset="45%" stop-color="#C9A227"/>
                <stop offset="100%" stop-color="#8C1F30"/>
              </linearGradient>
              <linearGradient id="smallHeartGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#FBF1DD"/>
                <stop offset="50%" stop-color="#F0D488"/>
                <stop offset="100%" stop-color="#C9A227"/>
              </linearGradient>
            </defs>
            <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z" fill="url(#heartGrad)"/>
          </svg>
          <svg class="heart-svg half right" viewBox="0 0 32 29.6" preserveAspectRatio="xMidYMid meet">
            <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z" fill="url(#heartGrad)"/>
          </svg>
          <div class="heart-label">A moment<br>is waiting</div>
          <svg class="small-heart" id="smallHeart" viewBox="0 0 32 29.6">
            <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z" fill="url(#smallHeartGrad)"/>
          </svg>
          <div class="particles-layer" id="particles"></div>
        </div>

        <p class="hint" id="hint">Tap the heart to begin</p>
      </section>

      <section id="revealContent" class="reveal hidden-state">
        <svg class="mini-heart" viewBox="0 0 32 29.6">
          <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z" fill="url(#smallHeartGrad)"/>
        </svg>

        <h1 class="name" id="nameTop">Ravi Kannan</h1>
        <div class="name-divider"></div>
        <h1 class="name" id="nameBottom">Dhurga Priya</h1>

        <div class="msg-block">
          <p class="anniversary-msg">Happy Wedding Anniversary ❤️</p>
          <p class="together-since">Together Since 2019</p>
          <p class="forever">2019 – Forever ❤️</p>
          <p class="wish">Ravi Kannan and Dhurga Priya were married in 2019 — wishing them a lifetime of love, laughter and togetherness.</p>
        </div>
      </section>

    </main>

    <div class="fullscreen-heart" id="fullscreenHeart" aria-hidden="true">
      <div class="fs-glow"></div>
      <div class="fs-heart">
        <svg viewBox="0 0 32 29.6">
          <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z" fill="url(#smallHeartGrad)"/>
        </svg>
      </div>
      <div class="fs-particles" id="fsParticles"></div>
    </div>

  </div>
</div>

<script>
(function(){
  var heartStage   = document.getElementById('heartStage');
  var preOpen      = document.getElementById('preOpen');
  var revealContent= document.getElementById('revealContent');
  var particlesLayer = document.getElementById('particles');
  var fsLayer      = document.getElementById('fullscreenHeart');
  var fsParticles  = document.getElementById('fsParticles');
  var nameTop      = document.getElementById('nameTop');
  var nameBottom   = document.getElementById('nameBottom');
  var hint         = document.getElementById('hint');
  var sparksBox    = document.getElementById('sparks');
  var opened = false;

  /* ---------- decorative twinkles ---------- */
  (function seedSparks(){
    for (var i=0;i<16;i++){
      var s = document.createElement('span');
      s.style.left = (Math.random()*100)+'%';
      s.style.top = (Math.random()*100)+'%';
      s.style.animationDuration = (2 + Math.random()*3)+'s';
      s.style.animationDelay = (Math.random()*4)+'s';
      sparksBox.appendChild(s);
    }
  })();

  /* ---------- mandala petal ring ---------- */
  (function drawPetals(){
    var ring = document.getElementById('petalRing');
    var n = 16;
    for (var i=0;i<n;i++){
      var angle = (360/n)*i;
      var petal = document.createElementNS('http://www.w3.org/2000/svg','path');
      petal.setAttribute('d','M100,32 C106,46 106,54 100,64 C94,54 94,46 100,32 Z');
      petal.setAttribute('transform','rotate('+angle+' 100 100)');
      ring.appendChild(petal);
    }
  })();

  function wrapLetters(el){
    var text = el.textContent;
    el.textContent = '';
    var delay = 0;
    for (var i = 0; i < text.length; i++){
      var ch = text[i];
      var span = document.createElement('span');
      span.className = 'letter';
      span.textContent = (ch === ' ') ? '\u00A0' : ch;
      span.style.animationDelay = (delay * 0.055) + 's';
      el.appendChild(span);
      delay++;
    }
  }

  function burstParticles(count){
    var items = ['💛','✨','🌸','💐','🌼'];
    for (var i = 0; i < count; i++){
      (function(){
        var span = document.createElement('span');
        span.className = 'particle';
        span.textContent = items[Math.floor(Math.random() * items.length)];
        var startX = 34 + Math.random() * 32;
        var drift = (Math.random() * 160 - 80);
        var duration = 1.8 + Math.random() * 1.4;
        var delay = Math.random() * 0.5;
        var size = 13 + Math.random() * 12;
        span.style.position = 'absolute';
        span.style.left = startX + '%';
        span.style.bottom = '44%';
        span.style.fontSize = size + 'px';
        span.style.opacity = '0';
        span.style.animation = 'fsFloat '+duration+'s ease-out '+delay+'s forwards';
        span.style.setProperty('--drift', drift + 'px');
        particlesLayer.appendChild(span);
        setTimeout(function(){ span.remove(); }, (duration+delay)*1000 + 100);
      })();
    }
  }

  function burstFsParticles(count){
    var items = ['❤️','✨','💛','🌸'];
    for (var i=0;i<count;i++){
      (function(){
        var span = document.createElement('span');
        span.textContent = items[Math.floor(Math.random()*items.length)];
        var x = Math.random()*100;
        var duration = 1.4 + Math.random()*1.6;
        var delay = Math.random()*0.9;
        var size = 12 + Math.random()*20;
        span.style.left = x+'%';
        span.style.bottom = (Math.random()*30)+'%';
        span.style.fontSize = size+'px';
        span.style.animationDuration = duration+'s';
        span.style.animationDelay = delay+'s';
        fsParticles.appendChild(span);
        setTimeout(function(){ span.remove(); }, (duration+delay)*1000 + 150);
      })();
    }
  }

  function triggerOpen(){
    if (opened) return;
    opened = true;

    /* STEP 1 — heart zoom */
    preOpen.classList.add('opening');
    heartStage.classList.remove('idle-label');
    heartStage.classList.add('zooming');

    setTimeout(function(){
      /* STEP 2 — heart break / open */
      heartStage.classList.remove('zooming');
      heartStage.classList.add('split');
      burstParticles(16);
    }, 750);

    setTimeout(function(){
      /* STEP 3 — full screen heart */
      fsLayer.classList.add('showing');
      requestAnimationFrame(function(){
        fsLayer.classList.add('grow');
      });
      burstFsParticles(22);
      setTimeout(function(){ burstFsParticles(14); }, 400);
    }, 750 + 900);

    setTimeout(function(){
      /* STEP 4 — hold ~1s already elapsed inside the delay below, then transition */
      preOpen.style.display = 'none';
      revealContent.classList.remove('hidden-state');
      wrapLetters(nameTop);
      wrapLetters(nameBottom);
      fsLayer.classList.add('fading');
    }, 750 + 900 + 1000 + 950);

    setTimeout(function(){
      fsLayer.classList.remove('showing','grow','fading');
    }, 750 + 900 + 1000 + 950 + 900);
  }

  heartStage.addEventListener('click', triggerOpen);
  heartStage.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      triggerOpen();
    }
  });

  /* ---------- Ambient background music (generated, no external file) ---------- */
  var audioCtx = null, masterGain = null, drone1 = null, drone2 = null, bellTimer = null;
  var playing = false;
  var musicBtn = document.getElementById('musicToggle');

  function playBell(){
    if (!audioCtx) return;
    var notes = [392.00, 440.00, 523.25, 587.33, 659.25];
    var freq = notes[Math.floor(Math.random() * notes.length)];
    var osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    var g = audioCtx.createGain();
    g.gain.value = 0.0001;
    osc.connect(g);
    g.connect(masterGain);
    var t = audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(0.5, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    osc.start(t);
    osc.stop(t + 2.7);
  }

  function startMusic(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.0001;
    masterGain.connect(audioCtx.destination);
    masterGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2);

    drone1 = audioCtx.createOscillator();
    drone1.type = 'sine';
    drone1.frequency.value = 196.0;
    drone2 = audioCtx.createOscillator();
    drone2.type = 'sine';
    drone2.frequency.value = 246.94;
    var droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.5;
    drone1.connect(droneGain);
    drone2.connect(droneGain);
    droneGain.connect(masterGain);
    drone1.start();
    drone2.start();

    playBell();
    bellTimer = setInterval(playBell, 4200);
  }

  function stopMusic(){
    if (bellTimer){ clearInterval(bellTimer); bellTimer = null; }
    if (masterGain && audioCtx){
      masterGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
    }
    var ctxToClose = audioCtx;
    var d1 = drone1, d2 = drone2;
    setTimeout(function(){
      try{ if (d1) d1.stop(); }catch(e){}
      try{ if (d2) d2.stop(); }catch(e){}
      if (ctxToClose) ctxToClose.close();
    }, 1100);
    audioCtx = null; drone1 = null; drone2 = null; masterGain = null;
  }

  musicBtn.addEventListener('click', function(){
    playing = !playing;
    if (playing){
      startMusic();
      musicBtn.textContent = '🔊 Music On';
      musicBtn.classList.add('active');
      musicBtn.setAttribute('aria-pressed', 'true');
    } else {
      stopMusic();
      musicBtn.textContent = '🎵 Music Off';
      musicBtn.classList.remove('active');
      musicBtn.setAttribute('aria-pressed', 'false');
    }
  });
})();
</script>

</body>
</html>
